[platformio]
src_dir = .
boards_dir = boards
build_dir = .pio/build-ble

[env:t-beams3-supreme-ble]
platform = espressif32 @ 8.0.0
framework = arduino
board = t-beams3-supreme
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -I Lab2_Display

build_src_filter =
    +<main.cpp>
    +<Lab2_Display/boardInit.cpp>
    +<Lab2_Display/display.cpp>

lib_deps =
    h2zero/NimBLE-Arduino @ 2.3.9
    olikraus/U8g2 @ 2.36.18
    lewisxhe/XPowersLib @ 0.3.3